<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Zoh OS" />
<meta name="theme-color" content="#08090c" />
<meta name="description" content="Personal operating system: training, Gartner, income and reviews" />
<title>Zoh OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css?v=4.1">
</head>
<body>
<header class="app-header" id="header">
  <div class="brand"><div class="brand-mark">Z</div>Zoh OS</div>
  <div class="header-right">
    <button class="icon-btn" data-act="tab" data-tab="goals" aria-label="Goals and wins">
      <svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a2 2 0 0 0 2 4h1M16 6h3a2 2 0 0 1-2 4h-1M12 13v4M8.5 20h7"/></svg>
    </button>
    <button class="icon-btn" data-act="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span class="dot" id="backupDot" hidden></span>
    </button>
  </div>
</header>

<main>
  <section class="screen" id="screen-today"></section>
  <section class="screen" id="screen-train"></section>
  <section class="screen" id="screen-money"></section>
  <section class="screen" id="screen-goals"></section>
  <section class="screen" id="screen-review"></section>
</main>

<nav class="tabs" aria-label="Main">
  <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Today</button>
  <button data-act="tab" data-tab="train"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Train</button>
  <button class="fab" data-act="log-menu" aria-label="Log something"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-act="tab" data-tab="money"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Money</button>
  <button data-act="tab" data-tab="review"><svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-6M22 19H2"/></svg>Review</button>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"><span class="msg"></span><button data-act="undo">Undo</button></div>
<div class="tip" id="tip"></div>

<script src="js/store.js?v=4.1"></script>
<script src="js/belt.js?v=4.1"></script>
<script src="js/model.js?v=4.1"></script>
<script src="js/ui.js?v=4.1"></script>
<script src="js/screens.js?v=4.1"></script>
<script src="js/sheets.js?v=4.1"></script>
<script src="js/main.js?v=4.1"></script>
</body>
</html>
